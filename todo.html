<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Izaiah | To Do List</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700&family=Source+Sans+3:wght@400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <main class="card">
        <p class="eyebrow"><a class="back-link" href="index.html">← Back home</a></p>
        <h1>To Do List</h1>
        <p class="handle">Things I need to get done</p>

        <section>
            <ul class="todo-list">
            </ul>

            <div class="todo-form">
                <input type="text" id="new-todo" placeholder="Add a new item">
                <button type="button" id="add-todo">Add To Do</button>
            </div>
        </section>
    </main>

    <script src="todo.js"></script>
</body>
</html>
